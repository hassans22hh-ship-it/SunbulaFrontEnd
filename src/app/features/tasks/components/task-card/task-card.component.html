<div class="group rounded-2xl shadow-sm border overflow-hidden hover:shadow-md transition-all duration-300 flex flex-col h-full"
     [style.backgroundColor]="theme().bg"
     [style.borderColor]="theme().border"
     [style.--card-text]="theme().text"
     [style.--card-text-muted]="theme().muted"
     [style.--card-text-subtle]="theme().subtle"
     [style.--card-surface]="theme().surface"
     [style.--card-surface-hover]="theme().surfaceHover"
     [style.--card-border]="theme().border"
     (click)="cardClicked.emit(task())">

  <div class="p-5 flex flex-col flex-1">
    <!-- Header: Title & Menu -->
    <div class="flex items-center justify-between mb-4 gap-3">
      <div class="flex items-center gap-3 min-w-0 flex-1">
        @if (task().emoji) {
          <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-inner border flex-shrink-0 group-hover:scale-110 transition-transform"
               [style.backgroundColor]="theme().surface"
               [style.borderColor]="theme().border">
            {{ task().emoji }}
          </div>
        }
        <div class="flex flex-col items-start gap-0.5 min-w-0 flex-1">
          <h4 class="text-base font-display font-bold break-words whitespace-normal w-full transition-colors"
              [style.color]="theme().text"
              [title]="task().title">
            {{ task().title }}
          </h4>
          <div class="flex flex-wrap items-center gap-2">
            <sb-behavior-badge [behavior]="task().behaviorType" class="scale-90 origin-left" />
            <ng-content select="[badge]" />
          </div>
        </div>
      </div>
      <div class="flex gap-1 relative">
        <button class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg transition-colors hover:scale-105 active:scale-95" 
                [style.color]="theme().subtle"
                [style.backgroundColor]="theme().surface"
                (click)="onEditClick($event)" title="Edit Task">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
        </button>
        <button class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg transition-colors hover:scale-105 active:scale-95" 
                [style.color]="theme().subtle"
                [style.backgroundColor]="theme().surface"
                (click)="onDuplicateClick($event)" title="Duplicate Task">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
        <button class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg transition-colors hover:scale-105 active:scale-95" 
                [style.color]="theme().subtle"
                [style.backgroundColor]="theme().surface"
                (click)="onIconClick($event)" title="Options">
          <svg viewBox="0 0 24 24" fill="none" class="w-4 h-4" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="1.5"></circle><circle cx="6" cy="12" r="1.5"></circle><circle cx="18" cy="12" r="1.5"></circle>
          </svg>
        </button>
        
        @if (showMenu()) {
          <div class="absolute right-0 top-9 w-40 bg-surface text-text shadow-2xl rounded-xl py-2 z-20 border border-border/50 text-sm font-semibold">
            @if (task().status === 1) {
              <button class="w-full text-left px-4 py-2 hover:bg-surface-2 text-primary transition-colors" (click)="onActivateClick($event)">
                Mark Active
              </button>
            } @else {
              <button class="w-full text-left px-4 py-2 hover:bg-surface-2 text-success transition-colors" (click)="onCompleteClick($event)">
                Complete
              </button>
            }
            <button class="w-full text-left px-4 py-2 hover:bg-surface-2 text-warning transition-colors" (click)="onArchiveToggleClick($event)">
              {{ task().isArchived ? 'Unarchive' : 'Archive' }}
            </button>
            <hr class="border-border/30 my-1" />
            <button class="w-full text-left px-4 py-2 hover:bg-danger/10 text-danger transition-colors" (click)="onDeleteClick($event)">
              Delete
            </button>
          </div>
        }
      </div>
    </div>

    <!-- Tags -->
    <div class="flex flex-wrap gap-2 mb-6">
      @for (cat of task().categories; track cat.id) {
        <div class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase tracking-wider border shadow-xs"
             [style.backgroundColor]="theme().surface"
             [style.color]="theme().muted"
             [style.borderColor]="theme().border">
          {{ cat.name }}
        </div>
      }
    </div>

    <!-- Footer: Action & Date -->
    <div class="mt-auto pt-4 border-t flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 sm:gap-0"
         [style.borderColor]="theme().border">
      <button (click)="toggleTimer($event)" 
              class="w-full sm:w-auto flex items-center justify-center gap-2 px-4 py-3 sm:py-2 font-bold text-sm sm:text-xs rounded-xl border-2 transition-all active:scale-95 shadow-sm"
              [style.backgroundColor]="isActive() ? (isPaused() ? 'rgba(245, 158, 11, 0.2)' : 'rgba(16, 185, 129, 0.25)') : theme().surface"
              [style.color]="isActive() ? (isPaused() ? '#F59E0B' : theme().activeTimer) : theme().text"
              [style.borderColor]="isActive() ? (isPaused() ? 'rgba(245, 158, 11, 0.4)' : theme().activeTimer) : theme().border">
        @if (isActive() && !isPaused()) {
          <i class="fa-solid fa-pause w-4 h-4 text-center"></i>
          Pause Timer
        } @else if (isActive() && isPaused()) {
          <i class="fa-solid fa-play w-4 h-4 text-center"></i>
          Resume Timer
        } @else {
          <i class="fa-solid fa-play w-4 h-4 text-center"></i>
          Start Timer
        }
      </button>
      
      <div class="flex flex-row sm:flex-col items-center sm:items-end justify-between sm:justify-start gap-2 sm:gap-0.5">
        <div class="text-[10px] font-bold flex items-center gap-1"
             [style.color]="isActive() ? theme().activeTimer : theme().text">
          <svg viewBox="0 0 24 24" fill="none" class="w-3 h-3" stroke="currentColor" stroke-width="3">
            <circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          {{ displayElapsed() | duration:'clock' }}
        </div>
        <div class="text-[9px] font-bold uppercase tracking-tighter"
             [style.color]="theme().subtle">
          {{ task().createdAt | relativeDate }}
        </div>
      </div>
    </div>
  </div>
</div>
